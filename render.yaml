services:
  - type: web
    name: movie-platform-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movie-platform-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_BASE_URL
        value: https://api.themoviedb.org/3
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: movie-platform-db
    databaseName: movie_platform
    user: movie_platform
    plan: free