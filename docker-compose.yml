services:
  backend:
    build: ./backend
    container_name: movie-backend
    environment:
      DATABASE_URL: sqlite:///./data/movie_platform.db
    volumes:
      - movie_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: movie-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  movie_data: